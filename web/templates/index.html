<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 AI PHÂN LOẠI RÁC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#1a1a2e;color:#eee;overflow-x:hidden}
.header{background:linear-gradient(135deg,#16213e,#0f3460);padding:15px;text-align:center;border-bottom:3px solid #4caf50}
.header h1{color:#4caf50;font-size:28px;margin-bottom:5px}
.header p{color:#aaa;font-size:14px}
.main{display:flex;flex-wrap:wrap;gap:15px;padding:15px;max-width:1400px;margin:0 auto}
.video-box{flex:2;min-width:400px;background:#16213e;border-radius:12px;padding:10px;border:2px solid #0f3460}
.video-box img{width:100%;border-radius:8px;display:block}
.result-box{flex:1;min-width:280px;display:flex;flex-direction:column;gap:15px}
.card{background:#16213e;border-radius:12px;padding:20px;border:2px solid #0f3460;text-align:center}
.card h2{font-size:20px;margin-bottom:10px;color:#4caf50}
.current-label{font-size:48px;font-weight:bold;margin:10px 0}
.current-conf{font-size:18px;color:#aaa}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.counter-item{background:#0f3460;border-radius:10px;padding:15px;text-align:center;border-left:4px solid}
.counter-item .icon{font-size:32px}
.counter-item .count{font-size:36px;font-weight:bold;margin:5px 0}
.counter-item .name{font-size:14px;color:#aaa;text-transform:uppercase}
.c-nhua{border-color:#e91e63}.c-nhua .count{color:#e91e63}
.c-kim_loai{border-color:#2196f3}.c-kim_loai .count{color:#2196f3}
.c-giay{border-color:#4caf50}.c-giay .count{color:#4caf50}
.c-khong{border-color:#9e9e9e}.c-khong .count{color:#9e9e9e}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 24px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;color:#fff}
.btn-reset{background:#ff9800}
.btn-capture{background:#2196f3}
.btn-pause{background:#f44336}
.btn-upload{background:#9c27b0}
.status{font-size:13px;color:#888;text-align:center;margin-top:10px}
.fps{font-size:12px;color:#666}
.upload-zone{border:2px dashed #555;border-radius:8px;padding:15px;text-align:center;margin-top:10px;cursor:pointer;transition:.3s}
.upload-zone:hover{border-color:#4caf50;background:#1a1a2e}
.upload-zone p{font-size:13px;color:#888}
@media(max-width:768px){.main{flex-direction:column}.video-box{min-width:auto}}
</style>
</head>
<body>
<div class="header">
    <h1>🤖 AI PHÂN LOẠI RÁC THẢI</h1>
    <p>YOLOv11 Nano 🖥️ Raspberry Pi 4 📡 Real-time</p>
</div>
<div class="main">
    <div class="video-box">
        <img id="video" src="" alt="Webcam">
        <div class="fps" id="fps">FPS: --</div>
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <p>📤 Khi webcam không hoạt động, click để UPLOAD ẢNH</p>
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="uploadImage(this)">
        </div>
    </div>
    <div class="result-box">
        <div class="card">
            <h2>🔍 ĐANG PHÁT HIỆN</h2>
            <div class="current-label" id="currentLabel">--</div>
            <div class="current-conf" id="currentConf">0%</div>
        </div>
        <div class="counters">
            <div class="counter-item c-nhua"><div class="icon">🥤</div><div class="count" id="cnt_nhua">0</div><div class="name">Nhựa</div></div>
            <div class="counter-item c-kim_loai"><div class="icon">🔩</div><div class="count" id="cnt_kim_loai">0</div><div class="name">Kim Loại</div></div>
            <div class="counter-item c-giay"><div class="icon">📄</div><div class="count" id="cnt_giay">0</div><div class="name">Giấy</div></div>
            <div class="counter-item c-khong"><div class="icon">❓</div><div class="count" id="cnt_khong_phai_rac">0</div><div class="name">Khác</div></div>
        </div>
        <div class="controls">
            <button class="btn btn-reset" onclick="doReset()">🔄 Reset</button>
            <button class="btn btn-capture" onclick="doCapture()">📸 Chụp</button>
            <button class="btn btn-pause" onclick="doPause()">⏯️ Dừng</button>
            <button class="btn btn-upload" onclick="document.getElementById('fileInput').click()">📤 Ảnh</button>
        </div>
        <div class="status" id="status">🔌 Đang kết nối...</div>
    </div>
</div>
<script>
let ws=null,paused=!1,lastLabel=''
function connect(){
    ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws')
    ws.onopen=()=>{document.getElementById('status').textContent='✅ Đã kết nối'}
    ws.onmessage=e=>{
        try{
            const d=JSON.parse(e.data)
            if(d.image)document.getElementById('video').src='data:image/jpeg;base64,'+d.image
            if(d.label){
                const lbl=document.getElementById('currentLabel'),conf=document.getElementById('currentConf')
                lbl.textContent=d.label_display||d.label;conf.textContent=(d.confidence*100).toFixed(1)+'%'
                const colors={nhua:'#e91e63',kim_loai:'#2196f3',giay:'#4caf50',khong_phai_rac:'#9e9e9e'}
                lbl.style.color=colors[d.label]||'#eee'
                if(d.label!==lastLabel&&d.confidence>0.4){lastLabel=d.label;ws.send(JSON.stringify({action:'count',label:d.label}))}
            }
            if(d.counter){for(const[k,v]of Object.entries(d.counter)){const el=document.getElementById('cnt_'+k);if(el)el.textContent=v}}
            if(d.fps)document.getElementById('fps').textContent='FPS: '+d.fps
        }catch(e){}
    }
    ws.onclose=()=>{document.getElementById('status').textContent='⏳ Đang kết nối lại...';setTimeout(connect,2000)}
    ws.onerror=()=>{ws.close()}
}
function doReset(){if(ws)ws.send(JSON.stringify({action:'reset'}))}
function doCapture(){if(ws)ws.send(JSON.stringify({action:'capture'}))}
function doPause(){paused=!paused;if(ws)ws.send(JSON.stringify({action:'pause',paused:paused}))}
function uploadImage(input){
    if(!input.files||!input.files[0])return
    const form=new FormData();form.append('file',input.files[0])
    fetch('/upload',{method:'POST',body:form}).then(r=>r.json()).then(d=>{
        if(d.image)document.getElementById('video').src='data:image/jpeg;base64,'+d.image
        if(d.detections&&d.detections.length>0){
            const det=d.detections[0];let dn=det.label
            const names={nhua:'NHỰA',kim_loai:'KIM LOẠI',giay:'GIẤY',khong_phai_rac:'❌ KHÔNG PHẢI'}
            const colors={nhua:'#e91e63',kim_loai:'#2196f3',giay:'#4caf50',khong_phai_rac:'#9e9e9e'}
            document.getElementById('currentLabel').textContent=names[dn]||dn
            document.getElementById('currentConf').textContent=(det.confidence*100).toFixed(1)+'%'
            document.getElementById('currentLabel').style.color=colors[dn]||'#eee'
        }else{
            document.getElementById('currentLabel').textContent='❌ KHÔNG PHẢI RÁC'
            document.getElementById('currentLabel').style.color='#9e9e9e'
        }
    }).catch(e=>document.getElementById('status').textContent='Lỗi: '+e)
}
connect()
</script>
</body>
</html>
